services:
  reachel-schedule:
    build: .
    container_name: reachel-schedule
    restart: unless-stopped
    env_file: .env
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:3080:3080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # For Google Calendar, first create ./secrets/google.json and give UID 1000
    # read access. Then uncomment this mount and configure its container path
    # as GOOGLE_APPLICATION_CREDENTIALS in .env.
    # volumes:
    #   - ./secrets/google.json:/run/secrets/google.json:ro
